# NiceTab (タブ管理の Chrome 拡張) の同期先の WebDAV (dav.takashiaihara.site)。Google Discover の記事の受け渡し (google-discover / google-discover-reader) にも使う。
# 拡張の「サイトへのアクセス」を「クリック時」のまま使うため、拡張の origin からの CORS だけを許可する。
# Google アカウント (Chrome のプロファイル) ごとにユーザーとフォルダを分け、他のアカウントのタブを読めないようにする。
# パスワードは Infisical の NICETAB_WEBDAV_PASSWORD_<名前> (home/prod)、mameta と john は自分の project (mameta/prod・john/prod) の NICETAB_WEBDAV_PASSWORD と同じ値を Coolify env に入れる。
# 上流はユーザーのフォルダを作らない (無いと PROPFIND 404 / PUT 409 で NiceTab の同期が失敗する) ので、ユーザーを足すときは volume に先に mkdir する。
services:
  dav:
    image: ghcr.io/hacdias/webdav:v5.17.1
    restart: unless-stopped
    expose:
      - "6065"
    command: ["--config", "/config.yml"]
    environment:
      DAV_PASSWORD_TAKASHIAIHARA: ${DAV_PASSWORD_TAKASHIAIHARA:?set via Coolify env}
      DAV_PASSWORD_DATEMEGANE: ${DAV_PASSWORD_DATEMEGANE:?set via Coolify env}
      DAV_PASSWORD_MAMETA: ${DAV_PASSWORD_MAMETA:?set via Coolify env}
      DAV_PASSWORD_JOHN: ${DAV_PASSWORD_JOHN:?set via Coolify env}
      # Infisical home/prod の GOOGLE_DISCOVER_DAV_PASSWORD / GOOGLE_DISCOVER_DAV_READER_PASSWORD と同じ値
      DAV_PASSWORD_GOOGLE_DISCOVER: ${DAV_PASSWORD_GOOGLE_DISCOVER:?set via Coolify env}
      DAV_PASSWORD_GOOGLE_DISCOVER_READER: ${DAV_PASSWORD_GOOGLE_DISCOVER_READER:?set via Coolify env}
      # Infisical home/prod の GOOGLE_NEWS_DAV_PASSWORD / GOOGLE_NEWS_DAV_READER_PASSWORD と同じ値
      DAV_PASSWORD_GOOGLE_NEWS: ${DAV_PASSWORD_GOOGLE_NEWS:?set via Coolify env}
      DAV_PASSWORD_GOOGLE_NEWS_READER: ${DAV_PASSWORD_GOOGLE_NEWS_READER:?set via Coolify env}
    volumes:
      - dav-data:/data
    configs:
      - source: dav-config
        target: /config.yml

# bind の content: (Coolify の拡張) は初回だけ読まれ、以後は Coolify の DB の中身が使われて repo と食い違う。
# compose 標準の configs はコンテナを作るときに書かれ、Coolify は deploy ごとにコンテナを作り直すので毎回この中身になる。
# compose が中の $ を展開するので、$ を書くなら $$ にする
configs:
  dav-config:
    content: |
          address: 0.0.0.0
          port: 6065
          # ユーザーの directory を書き忘れたときに全員のフォルダが見えないよう、既定は存在しないパスにする。
          # 親も無いので MKCOL / PUT は 409 で、クライアントからも作れない
          directory: /nonexistent/no-user-directory
          behindProxy: true
          permissions: CRUD
          log:
            format: console
            colors: false
          cors:
            enabled: true
            # Chrome ウェブストア版 NiceTab の拡張 ID (README のストア URL から)
            allowed_hosts:
              - chrome-extension://fonflmjnjbkigocpoommgmhljdpljain
          users:
            - username: takashiaihara
              password: "{env}DAV_PASSWORD_TAKASHIAIHARA"
              directory: /data/takashiaihara
            - username: datemegane
              password: "{env}DAV_PASSWORD_DATEMEGANE"
              directory: /data/datemegane
            - username: mameta
              password: "{env}DAV_PASSWORD_MAMETA"
              directory: /data/mameta
            - username: john
              password: "{env}DAV_PASSWORD_JOHN"
              directory: /data/john
            # NiceTab ではなく Google Discover の記事 (TakashiAihara/google-discover-rss)。家の収集ホストが書き、RSSHub の /google-discover が読む
            - username: google-discover
              password: "{env}DAV_PASSWORD_GOOGLE_DISCOVER"
              directory: /data/google-discover
              # seen.json を上書きするだけで消さない
              permissions: CRU
            - username: google-discover-reader
              password: "{env}DAV_PASSWORD_GOOGLE_DISCOVER_READER"
              directory: /data/google-discover
              permissions: R
            # Google ニュースのおすすめ (TakashiAihara/google-news-rss)。家の収集ホストが書き、RSSHub の /google-news-foryou が読む
            - username: google-news
              password: "{env}DAV_PASSWORD_GOOGLE_NEWS"
              directory: /data/google-news
              # news.json を上書きするだけで消さない
              permissions: CRU
            - username: google-news-reader
              password: "{env}DAV_PASSWORD_GOOGLE_NEWS_READER"
              directory: /data/google-news
              permissions: R

volumes:
  dav-data:
