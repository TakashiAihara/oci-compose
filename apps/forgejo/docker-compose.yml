services:
  forgejo:
    # メジャー版は DB migration を伴うので、上げるときは release notes を読んでから tag を変える
    image: codeberg.org/forgejo/forgejo:16
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      TZ: Asia/Tokyo
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: forgejo.takashiaihara.site
      FORGEJO__server__ROOT_URL: https://forgejo.takashiaihara.site/
      # ssh は内蔵サーバーを 2222 番で立て、port は publish しない。同じ Docker ネットワークの中からだけ届き、
      # Coolify が private repo (miharashi) を deploy key で取得するのに使う。外からの clone は HTTPS だけ
      # (22 番は oi1 の sshd が使っている)。画面に出る ssh の clone URL は外からは使えない
      FORGEJO__server__DISABLE_SSH: "false"
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      # 移行元に許すホスト。GitHub は API と release assets の配信元も含める
      FORGEJO__migrations__ALLOWED_DOMAINS: "github.com,*.github.com,*.githubusercontent.com"
      # メールは同じ coolify network の postfix (apps/smtp) 経由で Resend へ中継する。
      # 内部通信なので認証なし。postfix は自己署名 cert を出すので検証しない
      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtp
      FORGEJO__mailer__SMTP_ADDR: smtp
      FORGEJO__mailer__SMTP_PORT: "587"
      FORGEJO__mailer__FORCE_TRUST_SERVER_CERT: "true"
      FORGEJO__mailer__FROM: "Forgejo <noreply@takashiaihara.site>"
    volumes:
      - forgejo-data:/data
    labels:
      # image が 22 (ssh) と 3000 (web) を EXPOSE するので、Traefik に web の port を明示する
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"

volumes:
  forgejo-data:
