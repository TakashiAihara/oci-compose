# SeaweedFS core (oi1): master + filer + S3 gateway
# host network 前提: ノード間通信は VCN private IP 直 (SL で subnet 内 all 許可済み)
# port 割当: master 9333 / filer 8889 / s3 8333 (8080,8888 は traefik/tinyproxy が使用中)
# volume server は oim1 / oim2 だけに置く。oi1 の /srv/seaweedfs は boot volume なので、
# 詰まると apt / journald / lego の証明書更新が苦しくなる。遊休ディスクは oim 側にある
services:
  master:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    network_mode: host
    command: 'master -ip=${NODE_IP:?set in Coolify env} -port=9333 -mdir=/data -defaultReplication=000 -volumeSizeLimitMB=5000'
    volumes:
      - seaweedfs-master:/data

  filer:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    network_mode: host
    command: 'filer -master=${NODE_IP}:9333 -ip=${NODE_IP} -port=8889 -defaultStoreDir=/data'
    volumes:
      - seaweedfs-filer:/data
    depends_on:
      - master

  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    network_mode: host
    command: 's3 -filer=${NODE_IP}:8889 -port=8333'
    depends_on:
      - filer

volumes:
  seaweedfs-master:
  seaweedfs-filer:
