# Coolify joins every service to the shared `coolify` network so FreshRSS can
# reach the feed at http://rsshub:1200. Service names resolve there across apps,
# so the helpers carry the rsshub- prefix; `rsshub` itself is this app's name.
services:
  rsshub:
    build: .
    restart: unless-stopped
    environment:
      CACHE_TYPE: redis
      REDIS_URL: redis://rsshub-redis:6379/
      # Routes that fetch a URL from the subscription (/render/xpath, upstream /rsshub/transform/*).
      # The instance is reachable from the home IP and the coolify network only.
      ALLOW_USER_SUPPLY_UNSAFE_DOMAIN: "true"
      # Node sizes the heap to about half the 2g limit (1120MiB measured). A single heavy
      # route (/transformer-circuits) ran it out and took every route down until restart.
      NODE_OPTIONS: --max-old-space-size=1536
      # Password of the dav user google-news-reader (Infisical home/prod GOOGLE_NEWS_DAV_READER_PASSWORD) for /google-news-foryou.
      GOOGLE_NEWS_DAV_READER_PASSWORD: ${GOOGLE_NEWS_DAV_READER_PASSWORD}
      # Password of the dav user google-discover-reader (Infisical home/prod GOOGLE_DISCOVER_DAV_READER_PASSWORD) for /google-discover.
      GOOGLE_DISCOVER_DAV_READER_PASSWORD: ${GOOGLE_DISCOVER_DAV_READER_PASSWORD}
      # The key taba web on taba1 checks (Infisical home/prod TABA_WEB_KEY, the same value apps/taba-web sends) for /taba/rows.
      TABA_WEB_KEY: ${TABA_WEB_KEY}
      # X cookie of the sub account (same value twr uses on hermes-claude) for /twitter/*.
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:?set via Coolify env}
    depends_on:
      - rsshub-redis
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1200/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g

  # Cache only; nothing worth keeping across restarts.
  rsshub-redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
