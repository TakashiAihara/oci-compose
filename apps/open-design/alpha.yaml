# oauth2-proxy の alpha config。秘密は環境変数から読み、ここには書かない。
server:
  BindAddress: 0.0.0.0:4180
upstreamConfig:
  upstreams:
    - id: open-design
      path: /
      uri: http://open-design:7456
providers:
  - id: pocket-id
    provider: oidc
    clientID: open-design
    clientSecret: ${OPEN_DESIGN_OIDC_SECRET}
    scope: openid email profile groups
    # Pocket ID 側でもクライアントを open-design グループに絞っている。ここでも絞る
    allowedGroups:
      - open-design
    oidcConfig:
      issuerURL: https://id.takashiaihara.site
      emailClaim: email
      groupsClaim: groups
      audienceClaims:
        - aud
injectRequestHeaders:
  # daemon は OD_API_TOKEN を持たない要求を 401 にする。ブラウザに token を渡さず、ここで付ける
  - name: Authorization
    values:
      - secretSource:
          fromEnv: OD_API_BEARER
