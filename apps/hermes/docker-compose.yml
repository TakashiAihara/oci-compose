# 9router を使う 2 インスタンス。coolify network に繋ぐ必要があるのはこちらだけ
# (9router コンテナへ alias `9router` で到達するため)。OAuth 直結の 3 つは
# apps/hermes-oauth に分けてあり、共有ネットワークに接続していない。
services:
  hermes:
    # ask_hermes 用。9router combo free-forever。OAuth ベースでない唯一の経路なので
    # repo_vault には招待しない。dashboard もこのインスタンスにだけ載せる
    # (PTY を持つので、機密を扱わないここが一番被害範囲が小さい)。
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    expose:
      - "9119"
    environment:
      HERMES_DASHBOARD: "1"
    volumes:
      - hermes-data:/opt/data
    command: ["gateway", "run"]
    labels:
      # image に EXPOSE が 1 行も無いので Traefik が backend port を推測できない
      - "traefik.http.services.hermes.loadbalancer.server.port=9119"
    deploy:
      resources:
        limits:
          memory: 2g

  hermes-agy:
    # ask_agy 用。Antigravity の内蔵 provider が hermes から消えている
    # (issue #104167 で upstream に報告済み) ため、9router の ag/* 経由が唯一の道。
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    volumes:
      - hermes-agy-data:/opt/data
    command: ["gateway", "run"]
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  hermes-data:
  hermes-agy-data:
