# 9router を使うインスタンス。coolify network に繋ぐ必要があるのはこちらだけ
# (9router コンテナへ alias `9router` で到達するため)。OAuth 直結のものは
# apps/hermes-oauth に分けてあり、共有ネットワークに接続していない。
services:
  hermes:
    # ask_hermes 用。9router combo free-forever。OAuth ベースでない唯一の経路なので
    # repo_vault には招待しない。dashboard もこのインスタンスにだけ載せる
    # (PTY を持つので、機密を扱わないここが一番被害範囲が小さい)。
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    expose:
      - "9119"
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_INSTANCE: hermes
    volumes:
      - hermes-data:/opt/data
      - ./healthcheck.py:/opt/healthcheck.py:ro
    command: ["gateway", "run"]
    healthcheck:
      # 設定した platform が今の gateway で connected か。異常 / 回復は ntfy の hermes-alerts へ
      test: ["CMD", "python3", "/opt/healthcheck.py"]
      interval: 60s
      timeout: 20s
      retries: 2
      start_period: 15m
    labels:
      # image に EXPOSE が 1 行も無いので Traefik が backend port を推測できない
      - "traefik.http.services.hermes.loadbalancer.server.port=9119"
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  hermes-data:
